version: 0.0
os: linux

file_exists_behavior: OVERWRITE

files:
  - source: /
    destination: /var/www/subscription.jojoapp.in/

# ADD THIS SECTION BELOW
permissions:
  - object: /var/www/subscription.jojoapp.in/
    pattern: "**"
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - file
      - directory

hooks:
  BeforeInstall:
    - location: script/cleanup.sh
      timeout: 300
      runas: ec2-user

  AfterInstall:
    - location: script/deploy.sh
      timeout: 3600
      runas: ec2-user

  ApplicationStart:
    - location: script/nginx.sh
      timeout: 300
      runas: root
